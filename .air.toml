#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "backend/bin"

[build]
  args_bin = []
  bin = "./backend/bin/main"
  cmd = "cd backend && go build -o ./bin/main ./cmd/api"
  delay = 1000
  entrypoint = ["./backend/bin/main"]

  exclude_dir = [
    "assets",
    "backend/bin",
    "vendor",
    "testdata",
    "web",
    "docs",
    "scripts"
  ]

  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  ignore_dangerous_root_dir = false

  include_dir = [
    "backend"
  ]

  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []

  kill_delay = "0s"
  log = "build-errors.log"

  poll = false
  poll_interval = 0

  post_cmd = [
    "cd backend && swag fmt",
    "cd backend && swag init -g cmd/api/main.go --parseDependency --parseInternal"
  ]

  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
